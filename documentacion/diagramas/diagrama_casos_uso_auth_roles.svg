<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #0284c7; stroke-width: 2; rx: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
      .box-admin { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .actor-box { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .actor-text { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .usecase { fill: #ffffff; stroke: #0284c7; stroke-width: 1.5; rx: 20; }
      .usecase-admin { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 20; }
      .usecase-text { font-family: system-ui, sans-serif; font-size: 12px; fill: #0f172a; text-anchor: middle; font-weight: 500; }
      .line { stroke: #94a3b8; stroke-width: 1.5; }
      .line-admin { stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="40" y="45" class="title">OdontoAgenda CRM (DentalCare) — Diagrama de Casos de Uso</text>
  <text x="40" y="70" class="subtitle">Módulo de Autenticación, Roles Definitivos, Gestión de Usuarios y Notificaciones</text>

  <!-- Boundaries -->
  <rect x="260" y="90" width="800" height="680" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="280" y="120" font-family="system-ui, sans-serif" font-size="14px" font-weight="bold" fill="#0284c7">Límite del Sistema: OdontoAgenda CRM</text>

  <!-- Actores Columna Izquierda -->
  <!-- Paciente -->
  <rect x="40" y="140" width="160" height="50" class="actor-box" />
  <text x="120" y="170" class="actor-text">👤 Paciente</text>

  <!-- Odontologo -->
  <rect x="40" y="300" width="160" height="50" class="actor-box" />
  <text x="120" y="330" class="actor-text">🩺 Odontólogo</text>

  <!-- Recepcionista -->
  <rect x="40" y="460" width="160" height="50" class="actor-box" />
  <text x="120" y="490" class="actor-text">📋 Recepcionista</text>

  <!-- Administrador -->
  <rect x="40" y="620" width="160" height="50" style="fill: #14532d; stroke: #22c55e; stroke-width: 2; rx: 8;" />
  <text x="120" y="650" class="actor-text">🛡️ Administrador</text>

  <!-- Casos de Uso Comunes -->
  <!-- Iniciar Sesion -->
  <rect x="300" y="140" width="220" height="42" class="usecase" />
  <text x="410" y="166" class="usecase-text">CU-01: Iniciar Sesión (bcrypt)</text>

  <!-- Cerrar Sesion -->
  <rect x="300" y="200" width="220" height="42" class="usecase" />
  <text x="410" y="226" class="usecase-text">Cerrar Sesión (Invalidar sesión)</text>

  <!-- Recuperar Clave -->
  <rect x="300" y="260" width="220" height="42" class="usecase" />
  <text x="410" y="286" class="usecase-text">CU-03: Recuperar Contraseña</text>

  <!-- Registro Publico -->
  <rect x="300" y="320" width="220" height="42" class="usecase" />
  <text x="410" y="346" class="usecase-text">CU-02: Registrarse (Paciente)</text>

  <!-- Notificaciones Correo -->
  <rect x="300" y="380" width="220" height="42" class="usecase" />
  <text x="410" y="406" class="usecase-text">Recibir Notificaciones Email</text>

  <!-- Casos Operativos de Negocio -->
  <!-- Agendar Citas -->
  <rect x="580" y="140" width="220" height="42" class="usecase" />
  <text x="690" y="166" class="usecase-text">Agendar / Cancelar Cita Web</text>

  <!-- Agenda Odontologica -->
  <rect x="580" y="200" width="220" height="42" class="usecase" />
  <text x="690" y="226" class="usecase-text">Consultar Agenda Médica</text>

  <!-- Historial Clinico -->
  <rect x="580" y="260" width="220" height="42" class="usecase" />
  <text x="690" y="286" class="usecase-text">Consultar Historial Clínico</text>

  <!-- Iniciar / Finalizar Atencion -->
  <rect x="580" y="320" width="220" height="42" class="usecase" />
  <text x="690" y="346" class="usecase-text">Atender / Inasistencia 15m</text>

  <!-- Insumos y Reportes -->
  <rect x="580" y="380" width="220" height="42" class="usecase" />
  <text x="690" y="406" class="usecase-text">Gestionar Insumos / Citas</text>

  <!-- Sub-bloque Modulo Administrador de Usuarios -->
  <rect x="300" y="470" width="500" height="270" rx="8" class="box-admin" />
  <text x="320" y="500" font-family="system-ui, sans-serif" font-size="14px" font-weight="bold" fill="#15803d">Módulo Exclusivo Administrador: Gestión de Usuarios (UserPolicy)</text>

  <rect x="330" y="525" width="200" height="40" class="usecase-admin" />
  <text x="430" y="550" class="usecase-text">Listar / Buscar / Filtrar</text>

  <rect x="570" y="525" width="200" height="40" class="usecase-admin" />
  <text x="670" y="550" class="usecase-text">Crear (Enlace / Manual)</text>

  <rect x="330" y="585" width="200" height="40" class="usecase-admin" />
  <text x="430" y="610" class="usecase-text">Editar Datos y Rol</text>

  <rect x="570" y="585" width="200" height="40" class="usecase-admin" />
  <text x="670" y="610" class="usecase-text">Activar / Desactivar</text>

  <rect x="330" y="645" width="200" height="40" class="usecase-admin" />
  <text x="430" y="670" class="usecase-text">Reenviar Enlace Acceso</text>

  <rect x="570" y="645" width="200" height="40" class="usecase-admin" />
  <text x="670" y="670" class="usecase-text">Eliminar (SoftDeletes)</text>

  <!-- Conexiones Lineas -->
  <!-- Paciente -->
  <path d="M 200 165 L 300 160" class="line" />
  <path d="M 200 165 L 300 220" class="line" />
  <path d="M 200 165 L 300 280" class="line" />
  <path d="M 200 165 L 300 340" class="line" />
  <path d="M 200 165 L 300 400" class="line" />
  <path d="M 200 165 L 580 160" class="line" />

  <!-- Odontologo -->
  <path d="M 200 325 L 300 160" class="line" />
  <path d="M 200 325 L 580 220" class="line" />
  <path d="M 200 325 L 580 280" class="line" />
  <path d="M 200 325 L 580 340" class="line" />

  <!-- Recepcionista -->
  <path d="M 200 485 L 300 160" class="line" />
  <path d="M 200 485 L 580 400" class="line" />

  <!-- Administrador -->
  <path d="M 200 645 L 300 160" class="line" />
  <path d="M 200 645 L 300 480" class="line-admin" />
  <path d="M 200 645 L 580 400" class="line" />
</svg>
