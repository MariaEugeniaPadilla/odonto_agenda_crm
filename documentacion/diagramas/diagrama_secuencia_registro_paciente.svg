<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .participant-box { fill: #0284c7; rx: 6; }
      .participant-text { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #0284c7; stroke-width: 1.5; marker-end: url(#arrow); }
      .return-line { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 3,3; marker-end: url(#arrow-ret); }
      .msg-text { font-family: system-ui, sans-serif; font-size: 11px; fill: #1e293b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="30" y="35" class="title">Diagrama de Secuencia: Registro Público de Paciente</text>
  <text x="30" y="55" class="subtitle">Validación de Variable REGISTRO_PUBLICO, Asignación Única Rol Paciente y Notificación</text>

  <!-- Participantes -->
  <g transform="translate(40, 80)">
    <rect width="110" height="36" class="participant-box" />
    <text x="55" y="23" class="participant-text">Paciente Nuevo</text>
  </g>
  <line x1="95" y1="116" x2="95" y2="460" class="lifeline" />

  <g transform="translate(200, 80)">
    <rect width="110" height="36" class="participant-box" />
    <text x="55" y="23" class="participant-text">Vista /registro</text>
  </g>
  <line x1="255" y1="116" x2="255" y2="460" class="lifeline" />

  <g transform="translate(360, 80)">
    <rect width="120" height="36" class="participant-box" />
    <text x="60" y="23" class="participant-text">AuthController</text>
  </g>
  <line x1="420" y1="116" x2="420" y2="460" class="lifeline" />

  <g transform="translate(530, 80)">
    <rect width="140" height="36" class="participant-box" />
    <text x="70" y="23" class="participant-text">RegistroRequest</text>
  </g>
  <line x1="600" y1="116" x2="600" y2="460" class="lifeline" />

  <g transform="translate(700, 80)">
    <rect width="100" height="36" class="participant-box" />
    <text x="50" y="23" class="participant-text">MySQL DB</text>
  </g>
  <line x1="750" y1="116" x2="750" y2="460" class="lifeline" />

  <g transform="translate(820, 80)">
    <rect width="100" height="36" class="participant-box" />
    <text x="50" y="23" class="participant-text">Mail / Mailpit</text>
  </g>
  <line x1="870" y1="116" x2="870" y2="460" class="lifeline" />

  <!-- Pasos -->
  <line x1="95" y1="140" x2="255" y2="140" class="msg-line" />
  <text x="105" y="135" class="msg-text">1. Diligencia formulario de registro</text>

  <line x1="255" y1="170" x2="420" y2="170" class="msg-line" />
  <text x="265" y="165" class="msg-text">2. POST /registro</text>

  <line x1="420" y1="200" x2="600" y2="200" class="msg-line" />
  <text x="430" y="195" class="msg-text">3. Verifica config('app.registro_publico') == true</text>

  <line x1="600" y1="235" x2="750" y2="235" class="msg-line" />
  <text x="610" y="230" class="msg-text">4. Valida unicidad de correo y contraseña (min 8)</text>

  <line x1="420" y1="275" x2="750" y2="275" class="msg-line" />
  <text x="430" y="270" class="msg-text">5. INSERT INTO usuarios (role_id=4 'Paciente', activo=1, pass=bcrypt)</text>

  <line x1="420" y1="315" x2="870" y2="315" class="msg-line" />
  <text x="440" y="310" class="msg-text">6. notify(BienvenidaPacienteNotification)</text>

  <line x1="420" y1="355" x2="255" y2="355" class="return-line" />
  <text x="270" y="350" class="msg-text">7. Auth::login(paciente) + session()->regenerate()</text>

  <line x1="255" y1="395" x2="95" y2="395" class="return-line" />
  <text x="110" y="390" class="msg-text">8. Redirige a /paciente/dashboard con mensaje de bienvenida</text>
</svg>
