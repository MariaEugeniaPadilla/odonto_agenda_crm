<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .participant-box { fill: #0284c7; rx: 6; }
      .participant-text { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #0284c7; stroke-width: 1.5; marker-end: url(#arrow); }
      .return-line { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 3,3; marker-end: url(#arrow-ret); }
      .error-line { stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 3,3; marker-end: url(#arrow-err); }
      .msg-text { font-family: system-ui, sans-serif; font-size: 11px; fill: #1e293b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="30" y="35" class="title">Diagrama de Secuencia: Inicio de Sesión y Verificación de Estado</text>
  <text x="30" y="55" class="subtitle">Validación Bcrypt, Rate Limiting (5/min), Verificación de Activo y Redirección por Rol</text>

  <!-- Participantes -->
  <g transform="translate(40, 80)">
    <rect width="110" height="36" class="participant-box" />
    <text x="55" y="23" class="participant-text">Usuario</text>
  </g>
  <line x1="95" y1="116" x2="95" y2="500" class="lifeline" />

  <g transform="translate(200, 80)">
    <rect width="110" height="36" class="participant-box" />
    <text x="55" y="23" class="participant-text">Vista /login</text>
  </g>
  <line x1="255" y1="116" x2="255" y2="500" class="lifeline" />

  <g transform="translate(360, 80)">
    <rect width="110" height="36" class="participant-box" />
    <text x="55" y="23" class="participant-text">RateLimiter</text>
  </g>
  <line x1="415" y1="116" x2="415" y2="500" class="lifeline" />

  <g transform="translate(520, 80)">
    <rect width="120" height="36" class="participant-box" />
    <text x="60" y="23" class="participant-text">AuthController</text>
  </g>
  <line x1="580" y1="116" x2="580" y2="500" class="lifeline" />

  <g transform="translate(690, 80)">
    <rect width="100" height="36" class="participant-box" />
    <text x="50" y="23" class="participant-text">MySQL DB</text>
  </g>
  <line x1="740" y1="116" x2="740" y2="500" class="lifeline" />

  <g transform="translate(820, 80)">
    <rect width="100" height="36" class="participant-box" />
    <text x="50" y="23" class="participant-text">Session</text>
  </g>
  <line x1="870" y1="116" x2="870" y2="500" class="lifeline" />

  <!-- Pasos -->
  <line x1="95" y1="140" x2="255" y2="140" class="msg-line" />
  <text x="105" y="135" class="msg-text">1. Ingresa correo y contraseña</text>

  <line x1="255" y1="170" x2="580" y2="170" class="msg-line" />
  <text x="265" y="165" class="msg-text">2. POST /api/login</text>

  <line x1="580" y1="200" x2="415" y2="200" class="msg-line" />
  <text x="430" y="195" class="msg-text">3. Verifica intentos (&lt; 5)</text>

  <line x1="580" y1="240" x2="740" y2="240" class="msg-line" />
  <text x="590" y="235" class="msg-text">4. SELECT * FROM usuarios WHERE correo = ?</text>

  <line x1="740" y1="270" x2="580" y2="270" class="return-line" />
  <text x="610" y="265" class="msg-text">5. Retorna usuario + Hash</text>

  <!-- Bcrypt check -->
  <text x="590" y="300" font-family="system-ui, sans-serif" font-size="11px" font-weight="bold" fill="#0284c7">6. Hash::check(clave, hash) &amp;&amp; activo == 1</text>

  <line x1="580" y1="330" x2="870" y2="330" class="msg-line" />
  <text x="590" y="325" class="msg-text">7. Auth::login() + session()->regenerate()</text>

  <line x1="580" y1="370" x2="415" y2="370" class="return-line" />
  <text x="440" y="365" class="msg-text">8. RateLimiter::clear()</text>

  <line x1="580" y1="410" x2="255" y2="410" class="return-line" />
  <text x="310" y="405" class="msg-text">9. 200 OK + URL Redirección por Rol</text>

  <line x1="255" y1="450" x2="95" y2="450" class="return-line" />
  <text x="110" y="445" class="msg-text">10. Redirige a /admin, /odontologo o /paciente</text>
</svg>
