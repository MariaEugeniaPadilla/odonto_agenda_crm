<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a2563EB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a4B5563" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="aC0392B" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="aD97706" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
<rect width="1200" height="745" fill="#FAFBFE"/>
<text x="44" y="50" font-size="22" font-weight="bold" fill="#0F2A5C">DIAGRAMA DE ESTADOS DEL SERVICIO - ODONTOAGENDA CRM</text>
<text x="44" y="75" font-size="13" fill="#6B7280">Ciclo de vida de la atención odontológica incluyendo el control de inasistencias (No Asistió)</text>
<circle cx="36" cy="235" r="11" fill="#1F2937"/>
<polyline points="46,235 70,235" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#a4B5563)" style="color:#4B5563"/>
<polyline points="250,235 350,235" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#a4B5563)" style="color:#4B5563"/>
<polyline points="530,235 630,235" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#a4B5563)" style="color:#4B5563"/>
<polyline points="810,235 910,235" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#a4B5563)" style="color:#4B5563"/>
<polyline points="1000,280 1000,335" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#a4B5563)" style="color:#4B5563"/>
<polyline points="100,280 100,520 330,520" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aC0392B)" style="color:#C0392B"/>
<polyline points="160,280 160,480 330,480" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aC0392B)" style="color:#C0392B"/>
<polyline points="400,280 400,450" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aC0392B)" style="color:#C0392B"/>
<polyline points="350,450 350,330 220,330 220,280" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2563EB)" style="color:#2563EB"/>
<polyline points="500,280 500,410 765,410 765,450" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aD97706)" style="color:#D97706"/>
<polyline points="440,540 440,587" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#a4B5563)" style="color:#4B5563"/>
<polyline points="765,540 765,587" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#a4B5563)" style="color:#4B5563"/>
<polyline points="880,495 965,495 965,622 30,622 30,262 70,262" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2563EB)" style="color:#2563EB"/>
<rect x="70" y="190" width="180" height="90" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
<text x="160.0" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A3F8F">SOLICITADO</text>
<text x="160.0" y="236" text-anchor="middle" font-size="11" fill="#374151">Paciente reserva en línea</text>
<text x="160.0" y="251" text-anchor="middle" font-size="11" fill="#374151">En espera de confirmación</text>
<rect x="350" y="190" width="180" height="90" rx="12" fill="#E6F6FD" stroke="#0A9BD6" stroke-width="2"/>
<text x="440.0" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#0B5F85">ASIGNADO</text>
<text x="440.0" y="236" text-anchor="middle" font-size="11" fill="#374151">Cita y horario confirmados</text>
<text x="440.0" y="251" text-anchor="middle" font-size="11" fill="#374151">(Visible como Confirmada)</text>
<rect x="630" y="190" width="180" height="90" rx="12" fill="#F1ECFB" stroke="#7E57C2" stroke-width="2"/>
<text x="720.0" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A2C8A">EN PROCESO</text>
<text x="720.0" y="236" text-anchor="middle" font-size="11" fill="#374151">Paciente en consultorio</text>
<text x="720.0" y="251" text-anchor="middle" font-size="11" fill="#374151">Odontólogo inicia atención</text>
<text x="720.0" y="266" text-anchor="middle" font-size="11" fill="#374151">y consulta su historial</text>
<rect x="910" y="190" width="180" height="90" rx="12" fill="#E8F8EC" stroke="#2EAD4B" stroke-width="2"/>
<text x="1000.0" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#14692B">ATENDIDO</text>
<text x="1000.0" y="236" text-anchor="middle" font-size="11" fill="#374151">Atención finalizada con éxito</text>
<text x="1000.0" y="251" text-anchor="middle" font-size="11" fill="#374151">Descuenta stock y guarda</text>
<text x="1000.0" y="266" text-anchor="middle" font-size="11" fill="#374151">historial</text>
<rect x="330" y="450" width="220" height="90" rx="12" fill="#FDECEC" stroke="#E05252" stroke-width="2"/>
<text x="440.0" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#9B1C1C">CANCELADO</text>
<text x="440.0" y="496" text-anchor="middle" font-size="11" fill="#374151">Anulada por paciente (≥ 2 h antes)</text>
<text x="440.0" y="511" text-anchor="middle" font-size="11" fill="#374151">o rechazada por la clínica.</text>
<text x="440.0" y="526" text-anchor="middle" font-size="11" fill="#374151">Libera cupo. Puede reagendar</text>
<rect x="650" y="450" width="230" height="90" rx="12" fill="#FFF1E0" stroke="#F0932B" stroke-width="2"/>
<text x="765.0" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#B45309">NO ASISTIÓ (Inasistencia)</text>
<text x="765.0" y="496" text-anchor="middle" font-size="11" fill="#374151">Tolerancia de 15 min superada</text>
<text x="765.0" y="511" text-anchor="middle" font-size="11" fill="#374151">Paciente no se presenta a consulta</text>
<text x="765.0" y="526" text-anchor="middle" font-size="11" fill="#374151">Libera cupo y NO descuenta stock</text>
<circle cx="1000" cy="345" r="13" fill="#fff" stroke="#2EAD4B" stroke-width="3"/><circle cx="1000" cy="345" r="8" fill="#1F2937"/>
<text x="1026" y="349" font-size="11" font-weight="bold" fill="#1F2937">Fin (Atención exitosa)</text>
<circle cx="440" cy="600" r="13" fill="#fff" stroke="#E05252" stroke-width="3"/><circle cx="440" cy="600" r="8" fill="#1F2937"/>
<text x="466" y="604" font-size="11" font-weight="bold" fill="#1F2937">Fin (Cita cancelada)</text>
<circle cx="765" cy="600" r="13" fill="#fff" stroke="#F0932B" stroke-width="3"/><circle cx="765" cy="600" r="8" fill="#1F2937"/>
<text x="791" y="604" font-size="11" font-weight="bold" fill="#1F2937">Fin (Inasistencia registrada)</text>
<text x="300" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">Recepción</text>
<text x="300" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">confirma</text>
<text x="580" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">Inicia</text>
<text x="580" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">atención</text>
<text x="860" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">Finaliza</text>
<text x="860" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">tratamiento</text>
<text x="112" y="513" text-anchor="start" font-size="11" font-weight="bold" fill="#C0392B">Paciente anula (≥ 2 h)</text>
<text x="170" y="459" text-anchor="start" font-size="11" font-weight="bold" fill="#C0392B">Recepción rechaza</text>
<text x="170" y="472" text-anchor="start" font-size="11" font-weight="bold" fill="#C0392B">(correo con el motivo)</text>
<text x="408" y="345" text-anchor="start" font-size="11" font-weight="bold" fill="#C0392B">Cancelación</text>
<text x="408" y="358" text-anchor="start" font-size="11" font-weight="bold" fill="#C0392B">(≥ 2 h)</text>
<text x="285" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">Reagenda (opcional)</text>
<text x="973" y="520" text-anchor="start" font-size="11" font-weight="bold" fill="#2563EB">Reprograma</text>
<text x="973" y="533" text-anchor="start" font-size="11" font-weight="bold" fill="#2563EB">(opcional)</text>
<text x="510" y="404" text-anchor="start" font-size="11" font-weight="bold" fill="#D97706">Tolerancia de 15 min superada sin llegada del paciente</text>
<rect x="40" y="632" width="1120" height="90" rx="4" fill="#F4F6FB" stroke="#CBD2E0"/>
<text x="54" y="653" font-size="11" fill="#374151">REGLAS DEL SISTEMA:  [1] Las citas en Atendido ingresan al historial clínico y descuentan inventario.  [2] Las citas en Cancelado o No Asistió liberan el cupo y NO descuentan stock.</text>
<text x="54" y="671" font-size="11" fill="#374151">[3] Tras 15 min de demora sin aviso, recepción u odontólogo marcan «No Asistió».  [4] Tras la inasistencia, el paciente recibe un correo y puede reprogramar; dos faltas consecutivas inhabilitan la reserva web.</text>
<text x="54" y="689" font-size="11" fill="#374151">[5] Si recepción rechaza una solicitud, se envía un correo con el motivo y la cita queda Cancelada por la clínica.  [6] Si el paciente cancela con ≥ 2 h de anticipación puede reagendar, lo que evita la inasistencia.</text>
<text x="54" y="707" font-size="11" fill="#374151">[7] El odontólogo puede consultar el historial clínico del paciente al revisar la cita (Asignado) y durante la atención (En Proceso).</text>
