<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .participant-box { fill: #0284c7; rx: 6; }
      .participant-pwd { fill: #e11d48; rx: 6; }
      .participant-text { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #0284c7; stroke-width: 1.5; marker-end: url(#arrow); }
      .return-line { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 3,3; marker-end: url(#arrow-ret); }
      .msg-text { font-family: system-ui, sans-serif; font-size: 11px; fill: #1e293b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="30" y="35" class="title">Diagrama de Secuencia: Recuperación y Restablecimiento de Contraseña</text>
  <text x="30" y="55" class="subtitle">Password Broker de Laravel con Notificación Local y Protección de Enumeración</text>

  <!-- Participantes -->
  <g transform="translate(40, 80)">
    <rect width="110" height="36" class="participant-box" />
    <text x="55" y="23" class="participant-text">Usuario</text>
  </g>
  <line x1="95" y1="116" x2="95" y2="520" class="lifeline" />

  <g transform="translate(200, 80)">
    <rect width="120" height="36" class="participant-box" />
    <text x="60" y="23" class="participant-text">Vistas Web</text>
  </g>
  <line x1="260" y1="116" x2="260" y2="520" class="lifeline" />

  <g transform="translate(370, 80)">
    <rect width="120" height="36" class="participant-box" />
    <text x="60" y="23" class="participant-text">AuthController</text>
  </g>
  <line x1="430" y1="116" x2="430" y2="520" class="lifeline" />

  <g transform="translate(540, 80)">
    <rect width="130" height="36" class="participant-pwd" />
    <text x="65" y="23" class="participant-text">Password Broker</text>
  </g>
  <line x1="605" y1="116" x2="605" y2="520" class="lifeline" />

  <g transform="translate(710, 80)">
    <rect width="100" height="36" class="participant-box" />
    <text x="50" y="23" class="participant-text">MySQL DB</text>
  </g>
  <line x1="760" y1="116" x2="760" y2="520" class="lifeline" />

  <g transform="translate(830, 80)">
    <rect width="100" height="36" class="participant-box" />
    <text x="50" y="23" class="participant-text">Mail / Mailpit</text>
  </g>
  <line x1="880" y1="116" x2="880" y2="520" class="lifeline" />

  <!-- Pasos -->
  <line x1="95" y1="140" x2="260" y2="140" class="msg-line" />
  <text x="105" y="135" class="msg-text">1. Ingresa correo en /olvide-contrasena</text>

  <line x1="260" y1="170" x2="430" y2="170" class="msg-line" />
  <text x="270" y="165" class="msg-text">2. POST /olvide-contrasena</text>

  <line x1="430" y1="200" x2="605" y2="200" class="msg-line" />
  <text x="440" y="195" class="msg-text">3. createToken(usuario) si existe y está activo</text>

  <line x1="605" y1="230" x2="760" y2="230" class="msg-line" />
  <text x="615" y="225" class="msg-text">4. INSERT INTO password_reset_tokens</text>

  <line x1="430" y1="265" x2="880" y2="265" class="msg-line" />
  <text x="450" y="260" class="msg-text">5. notify(RecuperarContrasenaNotification con Token)</text>

  <line x1="430" y1="295" x2="260" y2="295" class="return-line" />
  <text x="275" y="290" class="msg-text">6. Mensaje neutro de éxito (no revela si el correo existe)</text>

  <line x1="95" y1="340" x2="260" y2="340" class="msg-line" />
  <text x="105" y="335" class="msg-text">7. Abre enlace desde Mailpit (/recuperar-contrasena/{token})</text>

  <line x1="260" y1="375" x2="430" y2="375" class="msg-line" />
  <text x="270" y="370" class="msg-text">8. POST /recuperar-contrasena (token + nueva clave)</text>

  <line x1="430" y1="410" x2="605" y2="410" class="msg-line" />
  <text x="440" y="405" class="msg-text">9. Broker::reset() valida token y fecha</text>

  <line x1="605" y1="440" x2="760" y2="440" class="msg-line" />
  <text x="615" y="435" class="msg-text">10. UPDATE usuarios SET contrasena = bcrypt(nueva)</text>

  <line x1="605" y1="470" x2="760" y2="470" class="msg-line" />
  <text x="615" y="465" class="msg-text">11. DELETE FROM password_reset_tokens</text>

  <line x1="430" y1="500" x2="95" y2="500" class="return-line" />
  <text x="110" y="495" class="msg-text">12. Redirección a /login con mensaje de contraseña actualizada</text>
</svg>
